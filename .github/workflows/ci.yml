name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '27 5 * * 0'
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run repository checks
        run: |
          docker run --rm -v "$PWD:/work" -w /work archlinux:latest bash -lc 'pacman -Sy --noconfirm git ripgrep shellcheck shfmt stylua gitleaks && git config --global --add safe.directory /work && ./scripts/check.sh'
  bootstrap-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Dry-run bootstrap in Arch container
        run: |
          docker run --rm -v "$PWD:/work" archlinux:latest bash -lc 'pacman -Sy --noconfirm git curl sudo && useradd -m builder && chown -R builder:builder /work && su - builder -c "cd /work && bash bootstrap/bootstrap.sh --dry-run --no-packages"'
  bootstrap-checkout-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Test conflict backup and repeat checkout in Arch container
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work archlinux:latest bash -lc 'pacman -Sy --noconfirm git curl sudo base-devel gitleaks && git config --system --add safe.directory /work && DOTFILES_CI_CONTAINER=1 bash bootstrap/test-integration.sh'
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all refs and the checked-out tree
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work archlinux:latest bash -lc '
            set -euo pipefail
            pacman -Sy --noconfirm git gitleaks >/dev/null
            gitleaks version
            gitleaks detect --source /work --log-opts="--all" --redact --exit-code 1
            gitleaks dir /work --redact --exit-code 1
          '
