name: Package validation
on:
  pull_request:
    paths:
      - 'bootstrap/packages/**'
      - 'scripts/check-packages.sh'
      - '.github/workflows/package-validation.yml'
  schedule:
    - cron: '18 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Arch and AUR package manifests
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work archlinux:latest bash -lc 'pacman -Sy --noconfirm python && bash scripts/check-packages.sh'
