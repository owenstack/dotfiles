name: Fresh install
on:
  workflow_dispatch:
  schedule:
    - cron: '42 6 * * 3'
permissions:
  contents: read
jobs:
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run full install in disposable Arch container
        env:
          FRESH_INSTALL_LOG_DIR: ${{ runner.temp }}/fresh-install-logs
        run: bash bootstrap/test-fresh-install.sh
      - name: Upload install and graphical smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fresh-install-logs
          path: ${{ runner.temp }}/fresh-install-logs/
          if-no-files-found: warn
          retention-days: 30
